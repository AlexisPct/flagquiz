name: flagquiz CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  # ------------------------------------------------------
  # JOB 1 : Validation du FRONTEND
  # ------------------------------------------------------
  frontend-check:
    name: Frontend (Lint, Typecheck, Test & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm install --no-audit
        working-directory: ./frontend

      - name: Lint Frontend (ESLint)
        run: npm run lint --if-present
        working-directory: ./frontend

      - name: Check Formatting Frontend (Prettier)
        run: npm run format:check --if-present
        working-directory: ./frontend

      - name: Type-check Frontend
        run: npm run type-check --if-present
        working-directory: ./frontend

      - name: Run Frontend Tests
        run: npm run test --if-present
        working-directory: ./frontend
        env:
          CI: true

      - name: Build Frontend
        run: npm run build
        working-directory: ./frontend

  # ------------------------------------------------------
  # JOB 2 : Validation du BACKEND
  # ------------------------------------------------------
  backend-check:
    name: Backend (Lint, Typecheck & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm install --no-audit
        working-directory: ./backend

      - name: Lint Backend (ESLint)
        run: npm run lint --if-present
        working-directory: ./backend

      - name: Check Formatting Backend (Prettier)
        run: npm run format:check --if-present
        working-directory: ./backend

      - name: Type-check Backend
        run: npm run type-check --if-present
        working-directory: ./backend

      - name: Run Backend Tests
        run: npm run test --if-present
        working-directory: ./backend
        env:
          CI: true